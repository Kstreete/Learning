<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="700" viewBox="0 0 4200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Aussie Group LLC LinkedIn Company Page Cover Banner</title>
  <desc id="desc">Premium, modern LinkedIn company cover featuring a professional globe with highlighted Australia and centered brand messaging.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#F2E9DC"/>
    </linearGradient>

    <radialGradient id="globeFill" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E7EFE8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CEDCCE" stop-opacity="0.95"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8DAF93" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8DAF93" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="australiaAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D67B3E"/>
      <stop offset="100%" stop-color="#B85E2D"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style><![CDATA[
      .headline { fill: #273033; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 78px; font-weight: 650; letter-spacing: 0.2px; }
      .subline { fill: #4D5B54; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 35px; font-weight: 520; letter-spacing: 0.8px; }
      .company { fill: #1F272A; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 58px; font-weight: 680; letter-spacing: 0.3px; }
      .ring { fill: none; stroke: #86A08A; stroke-opacity: 0.42; stroke-width: 2.8; }
      .grid { fill: none; stroke: #8AA08F; stroke-opacity: 0.25; stroke-width: 2; }
      .continent { fill: #8FA98F; fill-opacity: 0.86; }
      .continent-soft { fill: #9DB19D; fill-opacity: 0.72; }
      .line-accent { stroke: #6B846F; stroke-opacity: 0.25; stroke-width: 2; fill: none; }
    ]]></style>
  </defs>

  <rect width="4200" height="700" fill="url(#bgGradient)"/>

  <!-- Subtle texture waves for depth -->
  <path d="M0,510 C420,460 760,580 1180,530 C1600,480 1900,390 2300,430 C2740,474 3100,590 4200,490 L4200,700 L0,700 Z" fill="#FFFFFF" fill-opacity="0.16"/>
  <path d="M0,120 C460,180 780,70 1280,110 C1830,155 2240,260 2800,210 C3340,162 3660,40 4200,90" class="line-accent"/>
  <path d="M0,152 C560,222 900,132 1400,170 C1920,208 2420,320 3040,262 C3520,216 3820,110 4200,140" class="line-accent"/>

  <!-- Globe block (left of safe center) -->
  <g transform="translate(980 350)">
    <circle cx="0" cy="0" r="236" fill="url(#glow)" filter="url(#softBlur)"/>
    <circle cx="0" cy="0" r="206" fill="url(#globeFill)"/>
    <circle cx="0" cy="0" r="206" class="ring"/>

    <!-- Longitude/latitude -->
    <ellipse cx="0" cy="0" rx="170" ry="206" class="grid"/>
    <ellipse cx="0" cy="0" rx="118" ry="206" class="grid"/>
    <ellipse cx="0" cy="0" rx="58" ry="206" class="grid"/>

    <ellipse cx="0" cy="0" rx="206" ry="64" class="grid"/>
    <ellipse cx="0" cy="0" rx="206" ry="128" class="grid"/>

    <!-- Simplified continents -->
    <path class="continent" d="M-132,-56 C-98,-96 -52,-88 -30,-50 C-24,-30 -48,-14 -74,-10 C-102,-6 -136,-20 -142,-42 Z"/>
    <path class="continent-soft" d="M22,-120 C66,-122 94,-92 98,-64 C86,-44 64,-48 44,-66 C24,-82 14,-104 22,-120 Z"/>
    <path class="continent" d="M66,-20 C94,-24 122,-6 126,22 C108,40 86,44 62,34 C44,20 42,-8 66,-20 Z"/>

    <!-- Australia (prominent accent) -->
    <path fill="url(#australiaAccent)" d="M72,78 C92,66 130,66 150,86 C168,102 164,128 142,140 C122,152 88,150 68,132 C54,118 56,92 72,78 Z"/>
    <circle cx="156" cy="154" r="8" fill="url(#australiaAccent)"/>

    <!-- Highlight sheen -->
    <ellipse cx="-68" cy="-96" rx="62" ry="30" fill="#FFFFFF" fill-opacity="0.28"/>
  </g>

  <!-- Center-safe text block: critical content stays away from edges -->
  <g transform="translate(2320 350)">
    <text class="company" x="0" y="-88" text-anchor="middle">The Aussie Group LLC</text>
    <text class="subline" x="0" y="-20" text-anchor="middle">Philanthropic Fundraising Services</text>
    <text class="headline" x="0" y="90" text-anchor="middle">Strategic fundraising support for mission-driven organizations</text>
  </g>
</svg>

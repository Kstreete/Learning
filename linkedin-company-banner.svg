<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191" role="img" aria-labelledby="title desc">
  <title id="title">The Aussie Group LLC LinkedIn Company Banner</title>
  <desc id="desc">Premium LinkedIn banner with a polished globe highlighting Australia and centered brand messaging.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCF8F0"/>
      <stop offset="100%" stop-color="#F2E9DC"/>
    </linearGradient>

    <radialGradient id="sphere" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E8F0E9"/>
      <stop offset="100%" stop-color="#C9D9CA"/>
    </radialGradient>

    <radialGradient id="atmo" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#7FA084" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7FA084" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="australia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D67A3D"/>
      <stop offset="100%" stop-color="#B55C2D"/>
    </linearGradient>

    <clipPath id="clipGlobe">
      <circle cx="180" cy="96" r="72"/>
    </clipPath>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5B6D5F" flood-opacity="0.22"/>
    </filter>

    <style><![CDATA[
      .company { fill:#1F282B; font: 700 30px/1.2 Inter, "Segoe UI", Arial, sans-serif; letter-spacing:0.2px; }
      .sub { fill:#4E5C55; font: 600 13.5px/1.2 Inter, "Segoe UI", Arial, sans-serif; letter-spacing:0.35px; }
      .headline { fill:#273033; font: 600 20px/1.25 Inter, "Segoe UI", Arial, sans-serif; }
      .grid { fill:none; stroke:#7F9983; stroke-opacity:0.28; stroke-width:0.9; }
      .coast { fill:#86A289; fill-opacity:0.9; }
      .coast-soft { fill:#98AE99; fill-opacity:0.75; }
    ]]></style>
  </defs>

  <rect width="1128" height="191" fill="url(#bg)"/>
  <path d="M0,138 C140,120 220,156 370,144 C540,130 690,96 828,114 C954,130 1040,162 1128,142 L1128,191 L0,191 Z" fill="#FFFFFF" fill-opacity="0.16"/>
  <path d="M0,40 C180,60 300,38 468,50 C648,64 792,92 962,76 C1038,68 1084,56 1128,48" fill="none" stroke="#6D866F" stroke-opacity="0.18" stroke-width="1.3"/>

  <!-- Globe (left) -->
  <g filter="url(#softShadow)">
    <circle cx="180" cy="96" r="84" fill="url(#atmo)"/>
    <circle cx="180" cy="96" r="72" fill="url(#sphere)"/>
    <circle cx="180" cy="96" r="72" fill="none" stroke="#7B9680" stroke-opacity="0.5" stroke-width="1.1"/>

    <g clip-path="url(#clipGlobe)">
      <!-- latitude -->
      <ellipse class="grid" cx="180" cy="96" rx="72" ry="20"/>
      <ellipse class="grid" cx="180" cy="96" rx="72" ry="38"/>
      <ellipse class="grid" cx="180" cy="96" rx="72" ry="56"/>

      <!-- longitude -->
      <ellipse class="grid" cx="180" cy="96" rx="18" ry="72"/>
      <ellipse class="grid" cx="180" cy="96" rx="36" ry="72"/>
      <ellipse class="grid" cx="180" cy="96" rx="54" ry="72"/>

      <!-- refined continent silhouettes -->
      <path class="coast" d="M136 66 C144 55,158 49,173 51 C185 53,194 61,197 71 C191 80,182 84,171 84 C158 85,145 81,138 73 C135 70,134 68,136 66 Z"/>
      <path class="coast-soft" d="M210 56 C221 50,237 50,248 58 C257 65,260 78,254 87 C245 90,233 87,225 79 C216 72,210 64,210 56 Z"/>
      <path class="coast" d="M222 90 C234 86,249 88,258 97 C264 104,264 115,256 122 C245 126,232 123,224 114 C218 107,217 96,222 90 Z"/>
      <path class="coast-soft" d="M147 100 C154 94,165 94,173 99 C179 105,179 114,173 121 C165 124,155 123,149 117 C143 111,142 104,147 100 Z"/>

      <!-- Australia highlight -->
      <path fill="url(#australia)" d="M222 120 C229 114,242 113,251 119 C258 124,260 133,255 140 C247 145,234 146,225 141 C218 137,216 127,222 120 Z"/>
      <circle cx="259" cy="146" r="3.2" fill="url(#australia)"/>

      <!-- subtle sheen -->
      <ellipse cx="157" cy="67" rx="22" ry="10" fill="#FFFFFF" fill-opacity="0.27"/>
    </g>
  </g>

  <!-- Text block inside central safe area -->
  <g transform="translate(644 96)">
    <text class="company" x="0" y="-26" text-anchor="middle">The Aussie Group LLC</text>
    <text class="sub" x="0" y="-3" text-anchor="middle">Philanthropic Fundraising Services</text>
    <text class="headline" x="0" y="31" text-anchor="middle">Strategic fundraising support for mission-driven organizations</text>
  </g>
</svg>
